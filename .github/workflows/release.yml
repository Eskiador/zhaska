name: Release

# Al subir una etiqueta vX.Y.Z: pruebas, instalador de Windows y borrador de versión en GitHub Releases.
# El borrador NO llega a los usuarios hasta que lo publicas a mano tras probarlo (electron-updater solo ve
# versiones publicadas). owner/repo se deducen de este repositorio.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: node scripts/restore-e2e.cjs
      # App empaquetada (ASAR, fusibles, binarios nativos, adjuntos con OCR, terminal) antes de publicar nada
      - run: npx electron-builder --win dir --x64 --publish never
      - run: node scripts/package-e2e.mjs --app dist/win-unpacked/ZHASKA.exe
      # La versión del instalador sale de la etiqueta (v0.2.0 → 0.2.0)
      - run: npx electron-builder --win --x64 --publish always -c.extraMetadata.version=${GITHUB_REF_NAME#v}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
